<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>maths fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f0ee;--fg:#0f2136;--lime:#d9f75c;--pink:#f6c3e0;--blue:#6ba8e2;--mint:#c6f3df;--ink:#0f2136;--ok:#35c27a;--bad:#ff7b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13233a;--fg:#f2f6f5}}
:root[data-theme="dark"]{--bg:#13233a;--fg:#f2f6f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}
/* intro */
#intro{position:fixed;inset:0;background:#050505;z-index:5;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;transition:opacity .9s}
#intro.show #cv{opacity:.4}
#ttl{position:absolute;left:0;right:0;top:20%;text-align:center;color:#fff;opacity:0;transform:translateY(14px);transition:all .9s .1s;padding:0 20px}
#ttl h1{margin:0;font-size:clamp(40px,12vw,64px);line-height:1;font-weight:700;letter-spacing:-.03em}
#ttl p{margin:12px 0 0;font-size:15px;opacity:.75}
#startw{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));text-align:center;opacity:0;transition:opacity .8s .5s}
#intro.show #ttl,#intro.show #startw{opacity:1;transform:none}
#start{background:#fff;color:#000;font-weight:600;font-size:17px;padding:15px 64px;border-radius:14px;min-width:210px}
/* app */
#app{max-width:460px;margin:0 auto;padding:12px 12px 28px}
.lime{background:var(--lime);color:var(--ink);border-radius:28px 28px 30px 30px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;min-height:84px}
.lime b{font-size:19px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.lime small{display:block;font-weight:400;font-size:13px;opacity:.7}
.score{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.score i{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:15px}
.pink{background:var(--pink);color:var(--ink);border-radius:30px;padding:16px 20px 14px;margin-top:8px}
.bar{display:flex;gap:2px;height:10px;align-items:center}
.bar i{flex:1;height:100%;border-radius:5px;background:rgba(15,33,54,.18);transition:background .2s,transform .2s}
.bar i.cur{background:var(--ink);transform:scaleY(1.5)}
.bar i.ok{background:var(--ok)}.bar i.bad{background:#e5483a}
.prow{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:14px;font-weight:500;opacity:.8}
.chip{background:rgba(15,33,54,.1);padding:5px 11px;border-radius:12px;font-size:12px;max-width:58%;text-align:center;line-height:1.25}
.ctrl{display:flex;align-items:center;justify-content:space-around;margin:6px 0 4px}
.ctrl button{width:64px;height:56px;display:grid;place-items:center;border-radius:20px}
.ctrl button:active{background:rgba(15,33,54,.12)}
.ctrl svg{width:34px;height:34px;fill:var(--ink)}
.ctrl #pp svg{width:44px;height:44px}
.blue{position:relative;z-index:2;background:var(--blue);color:var(--ink);border-radius:30px;margin-top:8px;min-height:182px;padding:18px 20px}
.blue::after{content:"";position:absolute;left:56%;bottom:-13px;width:62px;height:13px;background:var(--blue);border-radius:0 0 12px 12px}
.tab{position:absolute;top:0;right:0;width:132px;height:92px;background:var(--bg);color:var(--fg);border-bottom-left-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tab::before{content:"";position:absolute;top:0;left:-28px;width:28px;height:28px;background:radial-gradient(circle at 0 100%,transparent 27.5px,var(--bg) 28px)}
.tab b{font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tab span{font-size:12px;opacity:.75;margin-top:4px}
.tab.low b{color:#ff8f80}
.ic{width:42px;height:42px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.bt{display:flex;align-items:center;gap:10px;font-size:14px}
.bt small{display:block;opacity:.75;font-size:12px}
.blue h2{margin:26px 0 0;font-size:28px;line-height:1.1;font-weight:600;text-transform:uppercase;letter-spacing:-.01em;padding-right:4px}
.tb{height:6px;border-radius:6px;background:rgba(15,33,54,.18);margin-top:14px;overflow:hidden}
.tb i{display:block;height:100%;width:100%;background:var(--ink);transition:width .2s linear}
.brow{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;font-weight:500}
.mint{position:relative;background:var(--mint);color:var(--ink);border-radius:30px;margin-top:8px;padding:22px 18px 20px;min-height:300px;overflow:hidden}
.cat{display:inline-block;background:var(--ink);color:#fff;border-radius:16px;padding:9px 16px;font-size:13px;font-weight:500;margin:0 0 14px -2px}
.ctx{white-space:pre-line;background:rgba(15,33,54,.08);border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.5;margin-bottom:12px}
.q{font-size:17px;line-height:1.55;font-weight:500;margin:0 0 16px;white-space:pre-line}
.ch{display:flex;flex-direction:column;gap:9px}
.ch button{display:flex;gap:11px;align-items:center;text-align:left;border:1.5px solid var(--ink);border-radius:22px;padding:11px 14px;font-size:15px;line-height:1.4;transition:background .15s}
.ch button b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--mint);display:grid;place-items:center;font-size:13px;font-weight:600}
.ch button:active:not(:disabled){background:rgba(15,33,54,.1)}
.ch button:disabled{cursor:default}
.ch button.ok{background:var(--ok);border-color:var(--ok)}
.ch button.bad{background:var(--bad);border-color:var(--bad)}
.fb{margin-top:14px;font-size:14px;font-weight:600;min-height:20px}
.pause{cursor:pointer;position:absolute;inset:0;background:var(--mint);z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:20px}
.pause small{font-weight:400;font-size:14px;opacity:.7}
.pause svg{width:54px;height:54px;fill:var(--ink)}
/* summary */
.big{font-size:60px;font-weight:700;line-height:1;margin:22px 0 0;letter-spacing:-.03em}
.rows{display:flex;flex-direction:column;gap:12px}
.rw{font-size:14px}.rw div{display:flex;justify-content:space-between;margin-bottom:5px}
.rw .tb{margin:0;background:rgba(15,33,54,.15)}.rw .tb i{transition:none}
details{margin-top:16px;font-size:14px}summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0;line-height:1.5;padding:9px 12px;background:rgba(15,33,54,.08);border-radius:14px}
.again{display:block;width:100%;margin-top:18px;background:var(--ink);color:#fff;border-radius:24px;padding:16px;font-weight:600;font-size:17px}
</style>
</head>
<body>
<section id="intro">
  <canvas id="cv"></canvas>
  <div id="ttl"><h1>maths fighter</h1><p>ฝึกโจทย์เชิงปริมาณ · 30 ข้อต่อชุด</p></div>
  <div id="startw"><button id="start">Start</button></div>
</section>
<main id="app" class="hide"></main>

/* ---------- intro: falling blocks ---------- */
const COLORS=['#6dd58c','#f59e4b','#e3f84f','#f29bc4','#ee6a62','#3a6df0','#6ac9a9','#a7b4ff','#c05fc7','#9cc8ff'];
const WORDS=['Ratio','Percent','Profit','Loss','Interest','Equation','Work','Graph','Table','Mean','Median','S.D.','Set','Data','ร้อยละ','กำไร','อัตราส่วน','สมการ','ดอกเบี้ย','ค่าเฉลี่ย'];
let raf=0;
function intro(){
  const cv=$('#cv'),ctx=cv.getContext('2d'),W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const reveal=()=>$('#intro').classList.add('show');
  if(!window.Matter){reveal();return}
  const {Engine,Bodies,Composite}=Matter,eng=Engine.create(),s=Math.min(W,520)/390,floor=H*0.76;
  eng.gravity.y=1.15;
  const wall=(x,y,w,h)=>Bodies.rectangle(x,y,w,h,{isStatic:true});
  Composite.add(eng.world,[wall(W/2,floor+60,W*3,120),wall(-60,H/2,120,H*4),wall(W+60,H/2,120,H*4)]);
  const ws=shuf(WORDS),pills=[];let n=0;
  const drop=()=>{
    if(n>=16)return;
    const w=(170+Math.random()*150)*s,h=(62+Math.random()*34)*s;
    const b=Bodies.rectangle(w/2+Math.random()*(W-w),-h,w,h,{chamfer:{radius:h/2},restitution:.08,friction:.5,angle:(Math.random()-.5)*2.4});
    b.pw=w;b.ph=h;b.col=COLORS[n%COLORS.length];b.txt=ws[n%ws.length];pills.push(b);Composite.add(eng.world,b);n++;setTimeout(drop,150);
  };
  drop();setTimeout(reveal,4300);
  const rr=(c,x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
  const loop=()=>{
    Engine.update(eng,1000/60);ctx.clearRect(0,0,W,H);
    for(const b of pills){ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
      ctx.fillStyle=b.col;rr(ctx,-b.pw/2,-b.ph/2,b.pw,b.ph,b.ph/2);ctx.fill();
      ctx.fillStyle='#0b0b0b';ctx.font='500 '+(b.ph*.36)+'px Prompt,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.txt,0,2);ctx.restore()}
    raf=requestAnimationFrame(loop);
  };
  loop();
}

/* ---------- set builder ---------- */
function seenGet(){try{return JSON.parse(localStorage.getItem('mf_seen')||'[]')}catch(e){return[]}}
function seenSet(a){try{localStorage.setItem('mf_seen',JSON.stringify(a))}catch(e){}}
function buildSet(){
  let seen=new Set(seenGet()),out=[];
  for(const c in PLAN){
    const pool=DATA.filter(q=>q.c===c);
    let fresh=shuf(pool.filter(q=>!seen.has(q.id))),pick=fresh.slice(0,PLAN[c]);
    if(pick.length<PLAN[c]){pool.forEach(q=>seen.delete(q.id));const rest=shuf(pool.filter(q=>!pick.includes(q)));pick=pick.concat(rest.slice(0,PLAN[c]-pick.length))}
    out=out.concat(pick);
  }
  if(out.length<30){const rest=shuf(DATA.filter(q=>!out.includes(q)));out=out.concat(rest.slice(0,30-out.length))}
  out=shuf(out).slice(0,30);out.forEach(q=>seen.add(q.id));seenSet([...seen]);return out;
}
function startSet(){
  clearTimeout(adv);lock=false;setNo++;
  const qs=buildSet(),n=qs.length;
  S={qs,n,i:0,paused:true,ans:Array(n).fill(null),done:Array(n).fill(false),ok:Array(n).fill(false),to:Array(n).fill(false),rem:Array(n).fill(TIME),cap:Array(n).fill(TIME),bonus:Array(n).fill(0),fin:false,started:false};
  last=performance.now();inQuiz=true;render();
}

/* ---------- navigation ---------- */
const nextOpen=(from)=>{for(let k=1;k<=S.n;k++){const j=(from+k)%S.n;if(!S.done[j]&&j!==from)return j}return -1};
function go(j){clearTimeout(adv);lock=false;S.i=j;last=performance.now();render()}
function advance(){clearTimeout(adv);lock=false;const j=nextOpen(S.i);if(j<0)finish();else go(j)}
function nextBtn(){clearTimeout(adv);lock=false;if(S.i<S.n-1)go(S.i+1);else{const j=nextOpen(S.i);if(j<0)finish();else go(j)}}
function prevBtn(){if(S.i>0)go(S.i-1)}
function togglePause(){S.paused=!S.paused;if(!S.paused)S.started=true;last=performance.now();render()}
function choose(k){
  const i=S.i;if(S.done[i]||lock||S.paused)return;
  const q=S.qs[i];S.ans[i]=k;S.done[i]=true;S.ok[i]=(k===q.a);lock=true;
  const r=S.rem[i],j=nextOpen(i);if(j>=0&&r>0){S.rem[j]+=r;S.cap[j]+=r;S.bonus[j]+=r}
  render();adv=setTimeout(advance,S.ok[i]?1100:2400);
}
function timeout(){
  const i=S.i;S.done[i]=true;S.ok[i]=false;S.to[i]=true;S.rem[i]=0;lock=true;render();adv=setTimeout(advance,2400);
}
setInterval(()=>{
  if(!S||!inQuiz||S.fin)return;
  const now=performance.now(),dt=(now-last)/1000;last=now;
  if(S.paused||lock||S.done[S.i]||document.hidden)return;
  S.rem[S.i]-=Math.min(dt,1);
  if(S.rem[S.i]<=0){timeout();return}
  tickUI();
},200);
document.addEventListener('visibilitychange',()=>{if(S&&!S.fin&&!S.done[S.i]&&!S.paused&&document.hidden){S.paused=true;render()}});

    '<div class="ctrl"><button id="bp" aria-label="ข้อก่อนหน้า">'+svgPrev+'</button><button id="pp" aria-label="หยุด/เล่นต่อ">'+(S.paused?svgPlay:svgPause)+'</button><button id="bn" aria-label="ข้ามข้อ">'+svgNext+'</button></div>'+
    '</section>'+
  '<section class="blue"><div class="tab'+(!dn&&S.rem[i]<10?' low':'')+'" id="tab"><b id="tv">'+(dn?(S.ok[i]?'✓':'✗'):fmt(S.rem[i]))+'</b><span>'+(dn?'ทำแล้ว':'เวลาที่เหลือ')+'</span></div>'+
    '<div class="bt"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg></div><div>Time bank<small>เวลาที่เหลือข้ามไปข้อถัดไป</small></div></div>'+
    '<h2>ข้อ '+(i+1)+' / '+n+'</h2><div class="tb"><i id="tbar" style="width:'+(dn?0:Math.min(100,S.rem[i]/S.cap[i]*100))+'%"></i></div>'+
    '<div class="brow"><span>โบนัสเวลา +'+fmt(S.bonus[i])+'</span><span>ผิด '+bad+' · เหลือ '+(n-ok-bad)+' ข้อ</span></div></section>'+
  '<section class="mint">'+(S.paused?'<div class="pause" id="pz">'+(S.started?svgPause+'หยุดเวลาอยู่<small>กดปุ่มเล่นเพื่อทำต่อ</small>':svgPlay+'พร้อมแล้วกดเล่น<small>เวลาจะเริ่มนับเมื่อกดปุ่มเล่น</small>')+'</div>':'')+
    '<div class="cat">'+esc(CATS[q.c])+'</div>'+(q.x?'<div class="ctx">'+esc(q.x)+'</div>':'')+
    '<p class="q">'+esc(q.q)+'</p><div class="ch">'+opts+'</div><div class="fb">'+fb+'</div></section>';
  $('#bp').onclick=prevBtn;$('#bn').onclick=nextBtn;$('#pp').onclick=togglePause;if($('#pz'))$('#pz').onclick=togglePause;
  app.querySelectorAll('.ch button').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
}
function tickUI(){
  const i=S.i,tv=$('#tv');if(!tv)return;
  tv.textContent=fmt(S.rem[i]);$('#tab').classList.toggle('low',S.rem[i]<10);
  $('#tbar').style.width=Math.min(100,S.rem[i]/S.cap[i]*100)+'%';
}

/* ---------- summary ---------- */
function finish(){
  S.fin=true;clearTimeout(adv);
  const {ok}=stats(),n=S.n,pct=Math.round(ok/n*100);
  const by={};S.qs.forEach((q,i)=>{(by[q.c]=by[q.c]||{t:0,o:0});by[q.c].t++;if(S.ok[i])by[q.c].o++});
  const rows=Object.keys(by).map(c=>'<div class="rw"><div><span>'+SHORT[c]+'</span><b>'+by[c].o+' / '+by[c].t+'</b></div><div class="tb"><i style="width:'+(by[c].o/by[c].t*100)+'%"></i></div></div>').join('');
  const wr=S.qs.map((q,i)=>S.ok[i]?'':'<p><b>ข้อ '+(i+1)+'</b> · '+esc(q.q.slice(0,90))+(q.q.length>90?'…':'')+'<br>เฉลย: '+LET[q.a]+'. '+esc(q.h[q.a])+(S.to[i]?' (หมดเวลา)':'')+'</p>').join('');
  $('#app').innerHTML=
  '<div class="lime"><b>สรุปผล<small>ชุดที่ '+setNo+' เสร็จสิ้น</small></b><div class="score"><i>'+pct+'%</i></div></div>'+
  '<section class="blue" style="min-height:170px"><div class="tab"><b>'+pct+'%</b><span>ความแม่นยำ</span></div><div class="bt"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div>คะแนนรวม<small>จาก '+n+' ข้อ</small></div></div><div class="big">'+ok+' / '+n+'</div></section>'+
  '<section class="mint" style="min-height:0"><div class="cat">แยกตามหัวข้อ</div><div class="rows">'+rows+'</div>'+(wr?'<details><summary>ข้อที่ทำผิด / หมดเวลา</summary>'+wr+'</details>':'<p style="font-weight:600;margin:14px 0 0">เก่งมาก ถูกทุกข้อ!</p>')+'</section>'+
  '<button class="again" id="again">เริ่มชุดใหม่</button>';
  $('#again').onclick=startSet;window.scrollTo(0,0);
}

/* ---------- boot ---------- */
$('#start').onclick=()=>{cancelAnimationFrame(raf);$('#intro').classList.add('hide');$('#app').classList.remove('hide');startSet();window.scrollTo(0,0)};
intro();
</script>
</body>
</html>
